name: Build and Deploy Docs

on:
  push:
    branches:
      - docs
      - zarr_stores_metonly2
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            sphinx==9.1.0 \
            pydata-sphinx-theme==0.19.0 \
            myst-parser==5.1.0 \
            sphinx-copybutton==0.5.2 \
            sphinx-autodoc-typehints==3.12.0
          # Install gates itself without its heavy runtime deps (torch, xarray,
          # numpy, etc.). Those are mocked out in docs/source/conf.py.
          pip install --no-deps -e .

      - name: Build HTML
        run: sphinx-build -b html docs/source docs/build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
